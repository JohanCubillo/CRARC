<style>
:root{
  --ink:#17251B; --canopy:#2E5339; --canopy-dk:#22402C; --leaf:#7FA96B;
  --mist:#F2F5EF; --paper:#FBFCF9; --sun:#E9B44C; --sun-dk:#C9962F; --line:#D8E0D2;
  --serif:"Fraunces",Georgia,serif; --sans:"Karla","Segoe UI",sans-serif;
  --wrap:1140px; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.65;font-size:1.0625rem}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:24px}
h1,h2,h3{font-family:var(--serif);line-height:1.12;font-weight:600}
.kicker{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--canopy);display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
.kicker::before{content:"";width:34px;height:2px;background:var(--leaf);border-radius:2px;flex:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:4px}

/* Header */
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,box-shadow .3s}
header.solid{background:rgba(251,252,249,.96);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(8px)}
.nav{display:flex;align-items:center;justify-content:space-between;padding-block:14px;gap:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand img{height:52px;width:auto;background:#fff;border-radius:10px;padding:5px}
.brand span{font-family:var(--serif);font-weight:700;font-size:1.05rem;line-height:1.15;color:#fff;max-width:180px;transition:color .3s}
header.solid .brand span{color:var(--canopy-dk)}
.nav-links{display:flex;align-items:center;gap:24px;list-style:none}
.nav-links a{text-decoration:none;font-weight:500;font-size:.98rem;color:#fff;transition:color .3s;white-space:nowrap}
header.solid .nav-links a{color:var(--ink)}
.nav-links a:hover{color:var(--sun)}
header.solid .nav-links a:hover{color:var(--canopy)}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.6);color:#fff;font-family:var(--sans);font-weight:700;font-size:.92rem;border-radius:999px;padding:.45em 2em .45em 1em;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.lang::after{content:"▾";position:absolute;right:.8em;top:50%;transform:translateY(-50%);color:#fff;pointer-events:none;font-size:.8rem;transition:color .3s}
header.solid .lang select{background:var(--mist);border-color:var(--line);color:var(--ink)}
header.solid .lang::after{color:var(--ink)}
.lang select option{color:var(--ink);background:#fff}
.btn{display:inline-block;text-decoration:none;font-weight:700;border-radius:999px;padding:.72em 1.5em;font-size:1rem;border:2px solid transparent;cursor:pointer;background:transparent;transition:transform .15s,background .2s,color .2s;font-family:var(--sans)}
.btn:active{transform:scale(.97)}
.btn-sun{background:var(--sun);color:var(--ink)}
.btn-sun:hover{background:var(--sun-dk)}
.btn-green{background:var(--canopy);color:#fff}
.btn-green:hover{background:var(--canopy-dk)}
.btn-ghost{border-color:#fff;color:#fff}
.btn-ghost:hover{background:#fff;color:var(--canopy-dk)}
.nav .btn{padding:.55em 1.3em}
.menu-toggle{display:none;background:none;border:0;cursor:pointer;width:44px;height:44px;position:relative;z-index:60}
.menu-toggle span{display:block;width:26px;height:3px;background:#fff;border-radius:3px;margin:5px auto;transition:transform .3s,opacity .3s,background .3s}
header.solid .menu-toggle span{background:var(--ink)}
.menu-open .menu-toggle span{background:var(--ink)}
.menu-open .menu-toggle span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.menu-open .menu-toggle span:nth-child(2){opacity:0}
.menu-open .menu-toggle span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

/* Hero compacto */
.hero{min-height:72svh;display:flex;align-items:flex-end;position:relative;isolation:isolate;color:#fff}
.hero-bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(23,37,27,.5) 0%,rgba(23,37,27,.2) 45%,rgba(23,37,27,.85) 100%)}
.hero-content{padding-top:160px;padding-bottom:90px;max-width:760px}
.hero .kicker{color:var(--sun)}
.hero .kicker::before{background:var(--sun)}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:700;text-wrap:balance}
.hero p{margin-top:1rem;font-size:clamp(1.05rem,2vw,1.25rem);max-width:560px;color:#E9EFE4}
.hero-content > *{opacity:0;transform:translateY(18px);animation:rise .8s ease forwards}
.hero-content > *:nth-child(2){animation-delay:.12s}
.hero-content > *:nth-child(3){animation-delay:.24s}
@keyframes rise{to{opacity:1;transform:none}}

.wave{display:block;width:100%;height:70px;margin-bottom:-1px}
section{padding-block:88px}
.section-head{max-width:680px;margin-bottom:52px}
.section-head h2{font-size:clamp(1.9rem,4vw,2.7rem)}
.section-head p{margin-top:.8rem;color:#3E4F43}

/* Quiénes somos */
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.split.rev{grid-template-columns:1fr 1.1fr}
.split .pic{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.split .pic img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3}
.split h2{font-size:clamp(1.9rem,4vw,2.6rem);margin-bottom:1rem}
.split p{color:#33422F;margin-top:.85rem}
.split p i{color:var(--canopy)}

/* Historia */
.historia{background:var(--mist)}
.hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.hist-grid .pic{position:sticky;top:110px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.hist-grid .pic img{width:100%;object-fit:cover;aspect-ratio:4/5}
.hist-steps{display:flex;flex-direction:column;gap:26px}
.hist-step{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;position:relative}
.hist-step::before{content:"";position:absolute;top:0;left:26px;width:44px;height:5px;border-radius:0 0 6px 6px;background:var(--leaf)}
.hist-step p{color:#33422F}
.hist-step p i{color:var(--canopy)}

/* Animales */
.ani-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.ani-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.ani-media{position:relative;overflow:hidden}
.ani-media img{width:100%;aspect-ratio:1/1;object-fit:cover;transition:transform .5s ease}
.ani-card:hover .ani-media img{transform:scale(1.05)}
.ani-story{position:absolute;inset:auto 0 0 0;background:linear-gradient(180deg,transparent,rgba(23,37,27,.92) 38%);color:#F2F5EF;padding:56px 20px 18px;font-size:.95rem;opacity:0;transform:translateY(12px);transition:opacity .35s,transform .35s}
.ani-card:hover .ani-story,.ani-card:focus-within .ani-story{opacity:1;transform:none}
@media (hover:none){.ani-story{position:static;opacity:1;transform:none;background:var(--canopy-dk);padding:16px 20px}}
.ani-body{padding:18px 22px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ani-body h3{font-size:1.35rem;color:var(--canopy-dk)}
.ani-body .sp{font-family:var(--serif);font-style:italic;color:var(--leaf);font-size:.98rem}
.badge{font-size:.75rem;font-weight:700;border-radius:999px;padding:.3em .85em;white-space:nowrap}
.badge.rehabilitating{background:#FBEED2;color:#8A6410}
.badge.ready-to-release{background:#E4EEDF;color:var(--canopy)}
.badge.permanent-resident{background:#E3E9E4;color:#3E5247}

/* Voluntariado + habitaciones */
.vol{background:var(--mist)}
.hab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:52px}
.hab-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;display:flex;flex-direction:column}
.hab-card h3{font-size:1.35rem;color:var(--canopy-dk)}
.hab-price{font-family:var(--serif);font-weight:700;font-size:2rem;color:var(--canopy);margin:.4rem 0 .7rem}
.hab-price small{font-family:var(--sans);font-weight:400;font-size:.9rem;color:#5C6B5C}
.hab-card .hl{font-family:var(--serif);font-style:italic;color:var(--canopy);margin-bottom:.6rem}
.hab-card .desc{font-size:.96rem;color:#33422F;margin-bottom:1.4rem}
.hab-card .btn{margin-top:auto;text-align:center}
.hab-note{margin-top:30px;color:#5C6B5C;font-size:.95rem}

/* Visítanos */
.info-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:1.4rem}
.info-card{background:var(--mist);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.info-card h4{font-family:var(--serif);color:var(--canopy-dk);font-size:1.05rem;margin-bottom:.35rem}
.info-card p{font-size:.94rem;color:#33422F;margin:0}

/* Formulario */
.contact{background:var(--canopy);color:#fff}
.contact .section-head{margin-bottom:38px}
.contact .kicker{color:var(--sun)}
.contact .kicker::before{background:var(--sun)}
.contact .section-head p{color:#D9E3D2}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:820px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:.9rem;font-weight:700;color:#CFE3B8}
.field input,.field select,.field textarea{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);border-radius:10px;color:#fff;font-family:var(--sans);font-size:1rem;padding:.65em .9em}
.field input::placeholder{color:#A9BCA4}
.field select option{color:var(--ink);background:#fff}
.field input:focus,.field select:focus{outline:3px solid var(--sun);outline-offset:2px}
.form-hint{margin-top:14px;color:#CFE3B8;font-size:.9rem;max-width:560px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.form-status{margin-top:12px;font-weight:700;color:var(--sun);min-height:1.4em}

/* FAQ */
.faq-list{max-width:820px}
.faq-item{border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:14px;overflow:hidden}
.faq-item summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;font-family:var(--serif);font-weight:600;font-size:1.12rem;color:var(--canopy-dk)}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:"+";font-size:1.5rem;color:var(--leaf);transition:transform .25s;flex:none}
.faq-item[open] summary::after{transform:rotate(45deg)}
.faq-item .a{padding:0 22px 20px;color:#33422F}

/* Footer */
footer{background:var(--ink);color:#C6D2C4;padding:60px 0 30px;font-size:.97rem}
.foot{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
.foot img{height:56px;background:#fff;border-radius:10px;padding:6px;margin-bottom:12px}
footer a{color:#C6D2C4;text-decoration:none}
footer a:hover{color:var(--sun)}
.copyright{margin-top:44px;padding-top:20px;border-top:1px solid #2B3A2E;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#8FA08D;font-size:.9rem}

/* Nav compacto en pantallas medianas: solo logo, enlaces sin salto */
@media (max-width:1280px){
  .brand span{display:none}
  .nav-links{gap:16px}
  .nav-links a{font-size:.93rem}
  .nav .btn{padding:.5em 1.1em}
}

@media (max-width:960px){
  .split,.split.rev,.hist-grid{grid-template-columns:1fr;gap:36px}
  .hist-grid .pic{position:static}
  .ani-grid{grid-template-columns:1fr 1fr}
  .hab-grid{grid-template-columns:1fr}
  .info-cards{grid-template-columns:1fr}
  .nav-links{position:fixed;inset:0;background:var(--paper);flex-direction:column;justify-content:center;gap:24px;transform:translateX(100%);transition:transform .35s;z-index:55}
  .nav-links a{font-size:1.2rem;color:var(--ink)}
  .menu-open .nav-links{transform:none}
  .menu-open .lang select{background:var(--mist);border-color:var(--line);color:var(--ink)}
  .menu-open .lang::after{color:var(--ink)}
  .menu-toggle{display:block}
}
@media (max-width:680px){
  section{padding-block:60px}
  .ani-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}


/* --- Página voluntariado --- */
.price-card{background:var(--canopy);color:#fff;border-radius:var(--radius);padding:40px 44px;display:flex;align-items:center;gap:40px;flex-wrap:wrap;justify-content:space-between}
.price-card .big{font-family:var(--serif);font-weight:700;font-size:clamp(3rem,7vw,4.6rem);color:var(--sun);line-height:1}
.price-card .big small{display:block;font-family:var(--sans);font-weight:400;font-size:1.05rem;color:#CFE3B8;margin-top:.3rem}
.price-card p{font-size:1.15rem;color:#E9EFE4;max-width:420px}
.timeline{position:relative;max-width:640px;padding-left:34px}
.timeline::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:22px}
.tl-item::before{content:"";position:absolute;left:-31px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--leaf);border:3px solid var(--paper)}
.tl-item:nth-child(2)::before,.tl-item:nth-child(6)::before{background:var(--sun)}
.tl-item b{font-family:var(--serif);color:var(--canopy-dk);font-size:1.05rem;display:block}
.tl-item span{color:#33422F;font-size:.98rem}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:1rem}
.chip{background:var(--mist);border:1px solid var(--line);border-radius:999px;padding:.45em 1.1em;font-size:.92rem;color:var(--canopy-dk);font-weight:700}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:44px}
.info-box{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px}
.info-box h3{font-size:1.3rem;color:var(--canopy-dk);margin-bottom:.7rem}
.info-box ul{list-style:none}
.info-box li{padding-left:1.4em;position:relative;margin-bottom:.6rem;color:#33422F;font-size:.98rem}
.info-box li::before{content:"✓";position:absolute;left:0;color:var(--leaf);font-weight:700}
.cta-band{background:var(--canopy);color:#fff;text-align:center}
.cta-band .kicker{justify-content:center;color:var(--sun)}
.cta-band .kicker::before{background:var(--sun)}
.cta-band h2{font-size:clamp(2rem,4.5vw,3rem);margin-bottom:1.6rem}
.cta-band .btn-row{justify-content:center}
@media (max-width:960px){.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<main>

      <h1 data-i18n="heroTitle"></h1>

  <!-- PRECIO -->
  <section id="precio" style="padding-top:0">

      <path d="M0,40 C240,90 480,-10 720,30 C960,70 1200,10 1440,45 L1440,70 L0,70 Z" fill="#FBFCF9"/>

        <p class="kicker" data-i18n="priceKick"></p>

  </div>

<script>
document.getElementById("logo").src = IMG.logo;
document.getElementById("logoFoot").src = IMG.logo;
document.getElementById("heroBg").style.backgroundImage = `url("${IMG.hero}")`;

const langSelect = document.getElementById("langSelect");
Object.keys(I18N).forEach(code => {
  const opt = document.createElement("option");
  opt.value = code;
  opt.textContent = `${I18N[code]._flag} ${I18N[code]._name}`;
  langSelect.appendChild(opt);
});

function applyLang(code){
  const dict = I18N[code] || I18N.es;
  document.documentElement.lang = code;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n;
    if (dict[k] != null) el.textContent = dict[k];
  });
  langSelect.value = code;
  try { localStorage.setItem("crarc-lang", code); } catch(e){}
}
let savedLang = "es";
try { savedLang = localStorage.getItem("crarc-lang") || "es"; } catch(e){}
applyLang(I18N[savedLang] ? savedLang : "es");
langSelect.addEventListener("change", () => applyLang(langSelect.value));

const header = document.getElementById("header");
const onScroll = () => header.classList.toggle("solid", window.scrollY > 40);
window.addEventListener("scroll", onScroll, { passive:true });
onScroll();

const toggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");
toggle.addEventListener("click", () => {
  const open = document.body.classList.toggle("menu-open");
  toggle.setAttribute("aria-expanded", open);
});
navLinks.querySelectorAll("a").forEach(a =>
  a.addEventListener("click", () => {
    document.body.classList.remove("menu-open");
    toggle.setAttribute("aria-expanded", "false");
  })
);

document.getElementById("waCta").addEventListener("click", (ev) => {
  ev.preventDefault();
  const dict = I18N[document.documentElement.lang] || I18N.es;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(dict.waMsg)}`, "_blank");
});

document.getElementById("footYear").textContent =
  "© " + new Date().getFullYear() + " Costa Rica Animal Rescue Center";
</script>
</body>
