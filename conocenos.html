": "Aidez-nous à secourir, protéger et préserver la faune sauvage.", "quienesTitle": "Qui sommes-nous", "quienesP1": "Nous sommes un centre de secours pour la faune sauvage et un sanctuaire pour les animaux sauvés du trafic illégal d'espèces, des accidents causés par l'être humain et des situations de maltraitance.", "quienesP2": "Nous disposons d'une clinique vétérinaire équipée pour accueillir les animaux en danger, gravement blessés ou en risque de mort.", "quienesP3": "Nous avons aussi un sanctuaire où vivent les animaux qui n'ont pas pu être réintégrés dans la nature : parce qu'ils ont été retirés de leur habitat à quelques semaines de vie, qu'ils nécessitent un suivi vétérinaire continu, ou que leurs blessures ne leur permettent plus de survivre à l'état sauvage.", "quienesEsp1": "Au refuge vivent des espèces comme le paresseux à deux doigts <i>(Choloepus hoffmanni)</i>, l'une des espèces les plus secourues en raison du trafic illégal et des accidents sur les lignes électriques.", "quienesEsp2": "Vous rencontrerez aussi le capucin à face blanche <i>(Cebus capucinus)</i>, le singe-araignée d'Amérique centrale <i>(Ateles geoffroyi)</i>, le singe hurleur <i>(Alouatta palliata)</i>, des agoutis <i>(Dasyprocta punctata)</i>, des ratons laveurs <i>(Procyon lotor)</i>, le kinkajou <i>(Potos flavus)</i>, des pécaris <i>(Pecari tajacu)</i> et des cerfs de Virginie <i>(Odocoileus virginianus)</i>.", "quienesEsp3": "Une grande diversité d'oiseaux comme l'ara rouge <i>(Ara macao)</i>, l'ara bleu <i>(Ara ararauna)</i>, la conure verte <i>(Aratinga holochlora)</i>, des perruches <i>(Melopsittacus undulatus)</i> et la chouette à lunettes <i>(Pulsatrix perspicillata)</i>, parmi bien d'autres espèces.", "histTitle": "Notre histoire", "histP1": "En 2009, le centre de secours a été fondé sur la côte caraïbe du Costa Rica, à Moín. Son premier sauvetage fut Buda, un animal sauvé du trafic illégal de faune sauvage juste avant d'être vendu comme animal de compagnie.", "histP2": "Le centre, situé à Moín, patrouillait aussi les plages pour protéger les nids d'une espèce en danger d'extinction : la tortue luth <i>(Dermochelys coriacea)</i>.", "histP3": "Mais les ramasseurs d'œufs illégaux n'étaient pas le seul défi. La construction d'un grand port à Moín menaçait les activités de secours et de conservation. En acte d'intimidation, le militant écologiste Jairo Mora Sandoval a été assassiné alors qu'il défendait les nids de tortues marines.", "histP4": "Face à la pression croissante et à la perte d'accès à la propriété d'origine, le centre a dû déménager à San Miguel de Turrúcares. Là, une propriété temporaire lui a été généreusement prêtée pour héberger les animaux en attendant une solution permanente.", "histP5": "La propriété d'origine à Moín a été occupée et, en 2016, après avoir vendu deux propriétés personnelles, la propriétaire du centre a pu acquérir le terrain où il fonctionne aujourd'hui — une propriété encore en cours de paiement. C'est pourquoi nous cherchons des bénévoles comme vous, pour prendre part au soin et à la protection de notre faune sauvage.", "aniTitle": "Animaux secourus", "aniSub": "Passez le curseur sur chaque carte pour découvrir son histoire.", "stRehab": "En réhabilitation", "stReady": "Prêt pour la liberté", "stPerm": "Résident permanent", "ani_grumpy_n": "Grumpy", "ani_grumpy_s": "Paresseux", "ani_grumpy_st": "Grumpy est arrivé avec le placenta encore enroulé autour de son corps ; vous pouvez nous aider à le réhabiliter à l'hôpital.", "ani_sharleen_n": "Sharleen", "ani_sharleen_s": "Singe hurleur", "ani_sharleen_st": "Sharleen a été secourue du trafic illégal d'animaux.", "ani_lola_n": "Lola", "ani_lola_s": "Capucin à face blanche", "ani_lola_st": "Lola a subi des maltraitances physiques ; au centre, nous avons soigné ses blessures.", "ani_gandy_n": "Gandy", "ani_gandy_s": "Singe-araignée", "ani_gandy_st": "Gandy était attaché dans un bar pour divertir les clients.", "ani_diniel_n": "Daniel", "ani_diniel_s": "Kinkajou", "ani_diniel_st": "Orphelin après la destruction de son habitat, secouru dès son plus jeune âge.", "ani_toro_n": "Bamboo", "ani_toro_s": "Cerf", "ani_toro_st": "Confisqué par les autorités après avoir été retiré de la nature.", "volTitle": "Bénévolat", "volP1": "Nos bénévoles sont des personnes qui ont décidé de donner une partie importante de leur temps et de leur dévouement à notre cause ; nous avons donc créé un espace sûr, convivial, qui favorise le vivre-ensemble et l'échange culturel.", "volP2": "Nos programmes de bénévolat sont des expériences immersives : ils demandent de loger au centre, et incluent donc tous l'hébergement et les repas. Nous disposons de l'infrastructure nécessaire pour que vous choisissiez ce qui convient le mieux à votre bien-être et à votre confort, avec de l'espace pour pratiquer vos activités préférées : yoga, lecture, exploration de la nature. Qu'imaginez-vous d'autre ?", "volP3": "L'expérience inclut la découverte du village et la possibilité de participer aux activités que nous préparons pour vous : feux de camp, karaoké, balades et bien plus.", "hospTitle": "Hôpital", "hospP1": "Pour réhabiliter la faune sauvage, nos bénévoles sont essentiels. Ils soignent les blessures, gèrent les urgences de l'hôpital, s'occupent de l'alimentation exigeante des bébés animaux et participent aux chirurgies et autres interventions médicales.", "hospP2": "Notre but premier est de réhabiliter des espèces, dont beaucoup sont en danger d'extinction, et de les rendre à la nature : c'est là que réside notre mission.", "hospP3": "Si vous êtes étudiant·e en médecine ou en soins vétérinaires, ou si vous découvrez votre vocation, c'est l'endroit idéal pour vous.", "habC_t": "Chambre partagée", "habC_p": "50 $ / nuit", "habC_h": "Partagez une chambre avec des personnes qui ont vos centres d'intérêt et créez des liens.", "habC_d": "Profitez d'un hébergement partagé avec trois repas par jour, ménage quotidien et des activités inoubliables.", "habP_t": "Chambre privée", "habP_p": "70 $ / nuit", "habP_h": "Préservez votre intimité dans une chambre avec salle de bain.", "habP_d": "Profitez d'un hébergement privé avec trois repas par jour, ménage quotidien et des activités inoubliables.", "habF_t": "Chambre d'hôtel", "habF_p": "160 $ / nuit", "habF_h": "Logez à l'hôtel du village.", "habF_d": "Profitez d'un hébergement au village ; nous nous chargeons du transport aller-retour jusqu'au centre.", "habCta": "Commencer", "visTitle": "Visitez-nous", "visP1": "Venez découvrir le sanctuaire et les animaux secourus qui résident au centre de façon permanente. Vous pouvez venir en famille ; nous sommes ouverts du lundi au dimanche, de 8h00 à 16h00.", "visP2": "Nous nous trouvons à Cebadilla de Turrúcares, dans la province d'Alajuela. La visite dure environ une heure, toujours accompagnée d'un guide qualifié au sein du refuge.", "girTitle": "Sorties éducatives", "girP1": "Des parcours conçus pour les écoles, collèges et groupes. Apprenez la conservation de la faune sauvage et le travail du centre de secours.", "girP2": "Une expérience qui allie éducation environnementale, contact avec la nature et souvenirs pour toujours.", "formTitle": "Devenez bénévole ou participez à une sortie éducative", "formSub": "Dites-nous ce qui vous intéresse et nous vous contacterons.", "formSubject": "Nuevo contacto desde la web CRARC", "fNombre": "Nom", "fEmail": "Email", "fWhats": "Numéro WhatsApp avec indicatif du pays", "fVisitar": "Je veux visiter", "fVol": "Je veux être bénévole", "fDonar": "Je veux faire un don", "fDieta": "Régime alimentaire", "fDR": "Régime classique", "fDV": "Végétarien", "fDVe": "Végan", "fDG": "Sans gluten", "fAlergias": "Allergies", "fPersonas": "Nombre de personnes", "fEnviar": "Envoyer", "faqTitle": "Questions fréquentes", "faqQ1": "Quels sont les horaires de visite ?", "faqA1": "Nous ouvrons tous les jours de 8h00 à 16h00, jours fériés compris.", "faqQ2": "Comment arriver au centre ?", "faqA2": "Cherchez Costa Rica Animal Rescue Center, à Cebadilla de Turrúcares.", "faqQ3": "Combien coûte l'entrée ?", "faqA3": "Nationaux : adultes ₡6 000, enfants ₡4 000. Étrangers : adultes 20 $, enfants 10 $.", "faqQ4": "Convient-il aux enfants ?", "faqA4": "Oui, nous proposons des visites guidées pensées pour les familles et les groupes scolaires.", "footOrg": "Costa Rica Animal Rescue Center · Cebadilla, Turrúcares", "footHorario": "Lun–Dim · 8:00 – 16:00", "fEnviarWa": "Envoyer par WhatsApp", "sendSending": "Envoi…", "sendOk": "Bien reçu ! Nous vous contacterons bientôt.", "sendErr": "L'envoi a échoué. Essayez le bouton WhatsApp ou écrivez-nous par email."}, "it": {"_name": "Italiano", "_flag": "🇮🇹", "navHome": "Home", "navQuienes": "Chi siamo", "navAnimales": "Animali", "navVol": "Volontariato", "navVisit": "Visitaci", "navFaq": "FAQ", "navDonate": "Dona", "kickHero": "Scopri il centro da dentro", "kickQuienes": "Il nostro scopo", "kickHist": "Da Moín a Turrúcares", "kickAni": "Ognuno con un nome e una storia", "kickVol": "Vivi l'esperienza", "kickHab": "Alloggio per volontari", "kickHosp": "Medicina per la fauna selvatica", "kickVis": "Porte aperte", "kickGiras": "Per scuole e gruppi", "perNight": "a notte", "habNote": "Tutti i programmi includono i pasti (3 al giorno) e l'alloggio.", "visHours": "Orari", "visHoursVal": "Da lunedì a domenica · 8:00 – 16:00", "visFees": "Biglietti d'ingresso", "visFeesNat": "Nazionali: adulti ₡6.000 · bambini ₡4.000", "visFeesExt": "Stranieri: adulti $20 · bambini $10", "formHint": "WhatsApp apre la chat con il messaggio pronto; «Invia» registra la tua richiesta e avvisa il centro via email.", "backHome": "Torna alla home", "heroTitle": "Costa Rica Animal Rescue Center", "heroSub": "Aiutaci a salvare, proteggere e conservare la fauna selvatica.", "quienesTitle": "Chi siamo", "quienesP1": "Siamo un centro di recupero della fauna selvatica e un santuario per animali salvati dal traffico illegale di specie, da incidenti causati dall'essere umano e da situazioni di maltrattamento.", "quienesP2": "Disponiamo di una clinica veterinaria attrezzata per accogliere animali in pericolo, con ferite gravi o in rischio di vita.", "quienesP3": "Abbiamo inoltre un santuario dove vivono gli animali che non hanno potuto essere reintegrati in natura: perché sottratti al loro habitat a poche settimane di vita, perché necessitano di controlli veterinari continui o perché le loro ferite non permettono più la sopravvivenza allo stato selvatico.", "quienesEsp1": "Nel rifugio vivono specie come il bradipo didattilo <i>(Choloepus hoffmanni)</i>, una delle specie più soccorse a causa del traffico illegale e degli incidenti con le linee elettriche.", "quienesEsp2": "Conoscerai anche il cebo cappuccino <i>(Cebus capucinus)</i>, la scimmia ragno centroamericana <i>(Ateles geoffroyi)</i>, la scimmia urlatrice <i>(Alouatta palliata)</i>, gli agutì <i>(Dasyprocta punctata)</i>, i procioni <i>(Procyon lotor)</i>, il cercoletto <i>(Potos flavus)</i>, i pecari <i>(Pecari tajacu)</i> e i cervi dalla coda bianca <i>(Odocoileus virginianus)</i>.", "quienesEsp3": "Una grande varietà di uccelli come l'ara scarlatta <i>(Ara macao)</i>, l'ara blu <i>(Ara ararauna)</i>, il parrocchetto verde <i>(Aratinga holochlora)</i>, i pappagallini <i>(Melopsittacus undulatus)</i> e il gufo dagli occhiali <i>(Pulsatrix perspicillata)</i>, tra molte altre specie.", "histTitle": "La nostra storia", "histP1": "Nel 2009 il centro di recupero è stato fondato sulla costa caraibica del Costa Rica, a Moín. Il suo primo salvataggio fu Buda, un animale sottratto al traffico illegale di fauna selvatica poco prima di essere venduto come animale domestico.", "histP2": "Il centro, situato a Moín, pattugliava anche le spiagge per proteggere i nidi di una specie in pericolo di estinzione: la tartaruga liuto <i>(Dermochelys coriacea)</i>.", "histP3": "Ma i raccoglitori illegali di uova non erano l'unica sfida. La costruzione di un importante porto a Moín minacciava le attività di soccorso e conservazione. Come atto di intimidazione, l'attivista ambientale Jairo Mora Sandoval fu assassinato mentre difendeva i nidi delle tartarughe marine.", "histP4": "A causa della pressione crescente e della perdita di accesso alla proprietà originale, il centro fu costretto a trasferirsi a San Miguel de Turrúcares. Lì venne generosamente prestata una proprietà temporanea per ospitare gli animali in attesa di una soluzione permanente.", "histP5": "La proprietà originale di Moín venne occupata e, nel 2016, dopo aver venduto due proprietà personali, la proprietaria del centro poté acquistare il terreno dove il centro opera oggi — una proprietà ancora in fase di pagamento. Per questo cerchiamo persone volontarie come te, perché tu faccia parte della cura e della protezione della nostra fauna selvatica.", "aniTitle": "Animali salvati", "aniSub": "Passa il cursore su ogni scheda per conoscere la sua storia.", "stRehab": "In riabilitazione", "stReady": "Pronto per la libertà", "stPerm": "Residente permanente", "ani_grumpy_n": "Grumpy", "ani_grumpy_s": "Bradipo", "ani_grumpy_st": "Grumpy è arrivato con la placenta ancora avvolta al corpo; puoi aiutarci a riabilitarlo in ospedale.", "ani_sharleen_n": "Sharleen", "ani_sharleen_s": "Scimmia urlatrice", "ani_sharleen_st": "Sharleen è stata salvata dal traffico illegale di animali.", "ani_lola_n": "Lola", "ani_lola_s": "Cebo cappuccino", "ani_lola_st": "Lola ha subito maltrattamenti fisici; al centro abbiamo curato le sue ferite.", "ani_gandy_n": "Gandy", "ani_gandy_s": "Scimmia ragno", "ani_gandy_st": "Gandy era legato in un bar per intrattenere i clienti.", "ani_diniel_n": "Daniel", "ani_diniel_s": "Cercoletto", "ani_diniel_st": "Rimasto orfano dopo la distruzione del suo habitat, salvato da cucciolo.", "ani_toro_n": "Bamboo", "ani_toro_s": "Cervo", "ani_toro_st": "Confiscato dalle autorità dopo essere stato sottratto alla natura.", "volTitle": "Volontariato", "volP1": "I nostri volontari sono persone che hanno deciso di donare una parte importante del loro tempo e della loro dedizione alla nostra causa; per questo abbiamo creato uno spazio sicuro, divertente, che garantisce convivenza e scambio culturale.", "volP2": "I nostri volontariati sono esperienze immersive: richiedono di alloggiare al centro, quindi tutti i programmi includono vitto e alloggio. Disponiamo dell'infrastruttura necessaria perché tu scelga il meglio per il tuo benessere e comfort, con spazio per praticare le attività che più ti piacciono: yoga, lettura, esplorare la natura. Cos'altro ti immagini di fare?", "volP3": "L'esperienza include la scoperta del paese e la possibilità di partecipare alle attività che organizziamo per te: falò, karaoke, passeggiate e molto altro.", "hospTitle": "Ospedale", "hospP1": "Per riabilitare la fauna selvatica, i nostri volontari sono fondamentali. Curano le ferite, gestiscono le emergenze dell'ospedale, si occupano dell'esigente alimentazione dei cuccioli e partecipano a interventi chirurgici e altre procedure mediche.", "hospP2": "Il nostro scopo principale è riabilitare le specie, molte in pericolo di estinzione, e restituirle alla natura: è lì che risiede la nostra missione.", "hospP3": "Se studi medicina o infermieristica veterinaria, o stai scoprendo la tua vocazione, questo è il posto ideale per te.", "habC_t": "Camera condivisa", "habC_p": "50 $ / notte", "habC_h": "Condividi la camera con persone con i tuoi stessi interessi e crea legami.", "habC_d": "Goditi l'alloggio condiviso con tre pasti al giorno, pulizia quotidiana della camera e attività indimenticabili.", "habP_t": "Camera privata", "habP_p": "70 $ / notte", "habP_h": "Mantieni la tua privacy in una camera con bagno.", "habP_d": "Goditi l'alloggio privato con tre pasti al giorno, pulizia quotidiana della camera e attività indimenticabili.", "habF_t": "Camera in hotel", "habF_p": "160 $ / notte", "habF_h": "Alloggia nell'hotel del paese.", "habF_d": "Goditi l'alloggio in paese; ci occupiamo noi del trasporto di andata e ritorno al centro.", "habCta": "Inizia", "visTitle": "Visitaci", "visP1": "Vieni a conoscere il santuario e gli animali salvati che risiedono in modo permanente al centro. Puoi venire con tutta la famiglia; siamo aperti da lunedì a domenica, dalle 8:00 alle 16:00.", "visP2": "Ci troviamo a Cebadilla de Turrúcares, nella provincia di Alajuela. Il percorso dura circa un'ora, sempre con una guida qualificata all'interno del rifugio.", "girTitle": "Gite educative", "girP1": "Percorsi pensati per scuole e gruppi. Impara la conservazione della fauna selvatica e il lavoro del centro di recupero.", "girP2": "Un'esperienza che unisce educazione ambientale, contatto con la natura e momenti che restano per sempre.", "formTitle": "Fai volontariato o partecipa a una gita educativa", "formSub": "Raccontaci cosa ti interessa e ti contatteremo.", "formSubject": "Nuevo contacto desde la web CRARC", "fNombre": "Nome", "fEmail": "Email", "fWhats": "Numero WhatsApp con prefisso internazionale", "fVisitar": "Voglio visitare", "fVol": "Voglio fare volontariato", "fDonar": "Voglio donare", "fDieta": "Dieta", "fDR": "Dieta regolare", "fDV": "Vegetariana", "fDVe": "Vegana", "fDG": "Senza glutine", "fAlergias": "Allergie", "fPersonas": "Quante persone siete", "fEnviar": "Invia", "faqTitle": "Domande frequenti", "faqQ1": "Quali sono gli orari di visita?", "faqA1": "Siamo aperti tutti i giorni dalle 8:00 alle 16:00, festivi inclusi.", "faqQ2": "Come si arriva al centro?", "faqA2": "Cercaci come Costa Rica Animal Rescue Center, a Cebadilla de Turrúcares.", "faqQ3": "Quanto costa l'ingresso?", "faqA3": "Nazionali: adulti ₡6.000, bambini ₡4.000. Stranieri: adulti $20, bambini $10.", "faqQ4": "È adatto ai bambini?", "faqA4": "Sì, offriamo visite guidate pensate per famiglie e gruppi scolastici.", "footOrg": "Costa Rica Animal Rescue Center · Cebadilla, Turrúcares", "footHorario": "Lun–Dom · 8:00 – 16:00", "fEnviarWa": "Invia su WhatsApp", "sendSending": "Invio…", "sendOk": "Ricevuto! Ti contatteremo <style>
:root{
  --ink:#17251B; --canopy:#2E5339; --canopy-dk:#22402C; --leaf:#7FA96B;
  --mist:#F2F5EF; --paper:#FBFCF9; --sun:#E9B44C; --sun-dk:#C9962F; --line:#D8E0D2;
  --serif:"Fraunces",Georgia,serif; --sans:"Karla","Segoe UI",sans-serif;
  --wrap:1140px; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.65;font-size:1.0625rem}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:24px}
h1,h2,h3{font-family:var(--serif);line-height:1.12;font-weight:600}
.kicker{font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--canopy);display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
.kicker::before{content:"";width:34px;height:2px;background:var(--leaf);border-radius:2px;flex:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:4px}

/* Header */
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,box-shadow .3s}
header.solid{background:rgba(251,252,249,.96);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(8px)}
.nav{display:flex;align-items:center;justify-content:space-between;padding-block:14px;gap:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand img{height:52px;width:auto;background:#fff;border-radius:10px;padding:5px}
.brand span{font-family:var(--serif);font-weight:700;font-size:1.05rem;line-height:1.15;color:#fff;max-width:180px;transition:color .3s}
header.solid .brand span{color:var(--canopy-dk)}
.nav-links{display:flex;align-items:center;gap:24px;list-style:none}
.nav-links a{text-decoration:none;font-weight:500;font-size:.98rem;color:#fff;transition:color .3s;white-space:nowrap}
header.solid .nav-links a{color:var(--ink)}
.nav-links a:hover{color:var(--sun)}
header.solid .nav-links a:hover{color:var(--canopy)}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.6);color:#fff;font-family:var(--sans);font-weight:700;font-size:.92rem;border-radius:999px;padding:.45em 2em .45em 1em;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.lang::after{content:"▾";position:absolute;right:.8em;top:50%;transform:translateY(-50%);color:#fff;pointer-events:none;font-size:.8rem;transition:color .3s}
header.solid .lang select{background:var(--mist);border-color:var(--line);color:var(--ink)}
header.solid .lang::after{color:var(--ink)}
.lang select option{color:var(--ink);background:#fff}
.btn{display:inline-block;text-decoration:none;font-weight:700;border-radius:999px;padding:.72em 1.5em;font-size:1rem;border:2px solid transparent;cursor:pointer;transition:transform .15s,background .2s,color .2s;font-family:var(--sans)}
.btn:active{transform:scale(.97)}
.btn-sun{background:var(--sun);color:var(--ink)}
.btn-sun:hover{background:var(--sun-dk)}
.btn-green{background:var(--canopy);color:#fff}
.btn-green:hover{background:var(--canopy-dk)}
.btn-ghost{border-color:#fff;color:#fff}
.btn-ghost:hover{background:#fff;color:var(--canopy-dk)}
.nav .btn{padding:.55em 1.3em}
.menu-toggle{display:none;background:none;border:0;cursor:pointer;width:44px;height:44px;position:relative;z-index:60}
.menu-toggle span{display:block;width:26px;height:3px;background:#fff;border-radius:3px;margin:5px auto;transition:transform .3s,opacity .3s,background .3s}
header.solid .menu-toggle span{background:var(--ink)}
.menu-open .menu-toggle span{background:var(--ink)}
.menu-open .menu-toggle span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.menu-open .menu-toggle span:nth-child(2){opacity:0}
.menu-open .menu-toggle span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

/* Hero compacto */
.hero{min-height:72svh;display:flex;align-items:flex-end;position:relative;isolation:isolate;color:#fff}
.hero-bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(23,37,27,.5) 0%,rgba(23,37,27,.2) 45%,rgba(23,37,27,.85) 100%)}
.hero-content{padding-top:160px;padding-bottom:90px;max-width:760px}
.hero .kicker{color:var(--sun)}
.hero .kicker::before{background:var(--sun)}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.8rem);font-weight:700;text-wrap:balance}
.hero p{margin-top:1rem;font-size:clamp(1.05rem,2vw,1.25rem);max-width:560px;color:#E9EFE4}
.hero-content > *{opacity:0;transform:translateY(18px);animation:rise .8s ease forwards}
.hero-content > *:nth-child(2){animation-delay:.12s}
.hero-content > *:nth-child(3){animation-delay:.24s}
@keyframes rise{to{opacity:1;transform:none}}

.wave{display:block;width:100%;height:70px;margin-bottom:-1px}
section{padding-block:88px}
.section-head{max-width:680px;margin-bottom:52px}
.section-head h2{font-size:clamp(1.9rem,4vw,2.7rem)}
.section-head p{margin-top:.8rem;color:#3E4F43}

/* Quiénes somos */
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.split.rev{grid-template-columns:1fr 1.1fr}
.split .pic{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.split .pic img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3}
.split h2{font-size:clamp(1.9rem,4vw,2.6rem);margin-bottom:1rem}
.split p{color:#33422F;margin-top:.85rem}
.split p i{color:var(--canopy)}

/* Historia */
.historia{background:var(--mist)}
.hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.hist-grid .pic{position:sticky;top:110px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.hist-grid .pic img{width:100%;object-fit:cover;aspect-ratio:4/5}
.hist-steps{display:flex;flex-direction:column;gap:26px}
.hist-step{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;position:relative}
.hist-step::before{content:"";position:absolute;top:0;left:26px;width:44px;height:5px;border-radius:0 0 6px 6px;background:var(--leaf)}
.hist-step p{color:#33422F}
.hist-step p i{color:var(--canopy)}

/* Animales */
.ani-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.ani-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.ani-media{position:relative;overflow:hidden}
.ani-media img{width:100%;aspect-ratio:1/1;object-fit:cover;transition:transform .5s ease}
.ani-card:hover .ani-media img{transform:scale(1.05)}
.ani-story{position:absolute;inset:auto 0 0 0;background:linear-gradient(180deg,transparent,rgba(23,37,27,.92) 38%);color:#F2F5EF;padding:56px 20px 18px;font-size:.95rem;opacity:0;transform:translateY(12px);transition:opacity .35s,transform .35s}
.ani-card:hover .ani-story,.ani-card:focus-within .ani-story{opacity:1;transform:none}
@media (hover:none){.ani-story{position:static;opacity:1;transform:none;background:var(--canopy-dk);padding:16px 20px}}
.ani-body{padding:18px 22px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ani-body h3{font-size:1.35rem;color:var(--canopy-dk)}
.ani-body .sp{font-family:var(--serif);font-style:italic;color:var(--leaf);font-size:.98rem}
.badge{font-size:.75rem;font-weight:700;border-radius:999px;padding:.3em .85em;white-space:nowrap}
.badge.rehabilitating{background:#FBEED2;color:#8A6410}
.badge.ready-to-release{background:#E4EEDF;color:var(--canopy)}
.badge.permanent-resident{background:#E3E9E4;color:#3E5247}

/* Voluntariado + habitaciones */
.vol{background:var(--mist)}
.hab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:52px}
.hab-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:30px 28px;display:flex;flex-direction:column}
.hab-card h3{font-size:1.35rem;color:var(--canopy-dk)}
.hab-price{font-family:var(--serif);font-weight:700;font-size:2rem;color:var(--canopy);margin:.4rem 0 .7rem}
.hab-price small{font-family:var(--sans);font-weight:400;font-size:.9rem;color:#5C6B5C}
.hab-card .hl{font-family:var(--serif);font-style:italic;color:var(--canopy);margin-bottom:.6rem}
.hab-card .desc{font-size:.96rem;color:#33422F;margin-bottom:1.4rem}
.hab-card .btn{margin-top:auto;text-align:center}
.hab-note{margin-top:30px;color:#5C6B5C;font-size:.95rem}

/* Visítanos */
.info-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:1.4rem}
.info-card{background:var(--mist);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.info-card h4{font-family:var(--serif);color:var(--canopy-dk);font-size:1.05rem;margin-bottom:.35rem}
.info-card p{font-size:.94rem;color:#33422F;margin:0}

/* Formulario */
.contact{background:var(--canopy);color:#fff}
.contact .section-head{margin-bottom:38px}
.contact .kicker{color:var(--sun)}
.contact .kicker::before{background:var(--sun)}
.contact .section-head p{color:#D9E3D2}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:820px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:.9rem;font-weight:700;color:#CFE3B8}
.field input,.field select,.field textarea{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);border-radius:10px;color:#fff;font-family:var(--sans);font-size:1rem;padding:.65em .9em}
.field input::placeholder{color:#A9BCA4}
.field select option{color:var(--ink);background:#fff}
.field input:focus,.field select:focus{outline:3px solid var(--sun);outline-offset:2px}
.form-hint{margin-top:14px;color:#CFE3B8;font-size:.9rem;max-width:560px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.form-status{margin-top:12px;font-weight:700;color:var(--sun);min-height:1.4em}

/* FAQ */
.faq-list{max-width:820px}
.faq-item{border:1px solid var(--line);border-radius:12px;background:var(--paper);margin-bottom:14px;overflow:hidden}
.faq-item summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;font-family:var(--serif);font-weight:600;font-size:1.12rem;color:var(--canopy-dk)}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:"+";font-size:1.5rem;color:var(--leaf);transition:transform .25s;flex:none}
.faq-item[open] summary::after{transform:rotate(45deg)}
.faq-item .a{padding:0 22px 20px;color:#33422F}

/* Footer */
footer{background:var(--ink);color:#C6D2C4;padding:60px 0 30px;font-size:.97rem}
.foot{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
.foot img{height:56px;background:#fff;border-radius:10px;padding:6px;margin-bottom:12px}
footer a{color:#C6D2C4;text-decoration:none}
footer a:hover{color:var(--sun)}
.copyright{margin-top:44px;padding-top:20px;border-top:1px solid #2B3A2E;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#8FA08D;font-size:.9rem}

/* Nav compacto en pantallas medianas: solo logo, enlaces sin salto */
@media (max-width:1280px){
  .brand span{display:none}
  .nav-links{gap:16px}
  .nav-links a{font-size:.93rem}
  .nav .btn{padding:.5em 1.1em}
}

@media (max-width:960px){
  .split,.split.rev,.hist-grid{grid-template-columns:1fr;gap:36px}
  .hist-grid .pic{position:static}
  .ani-grid{grid-template-columns:1fr 1fr}
  .hab-grid{grid-template-columns:1fr}
  .info-cards{grid-template-columns:1fr}
  .nav-links{position:fixed;inset:0;background:var(--paper);flex-direction:column;justify-content:center;gap:24px;transform:translateX(100%);transition:transform .35s;z-index:55}
  .nav-links a{font-size:1.2rem;color:var(--ink)}
  .menu-open .nav-links{transform:none}
  .menu-open .lang select{background:var(--mist);border-color:var(--line);color:var(--ink)}
  .menu-open .lang::after{color:var(--ink)}
  .menu-toggle{display:block}
}
@media (max-width:680px){
  section{padding-block:60px}
  .ani-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>

</footer>

<script>
document.getElementById("logo").src = IMG.logo;
document.getElementById("logoFoot").src = IMG.logo;
document.getElementById("heroBg").style.backgroundImage = `url("${IMG.hero}")`;
document.getElementById("imgQuienes").src = IMG.quienes;
document.getElementById("imgHist").src = IMG.familia;
document.getElementById("imgVol").src = IMG.voluntariados;
document.getElementById("imgHosp").src = IMG.hospital;
document.getElementById("imgVis").src = IMG.visitanos;
document.getElementById("imgGiras").src = IMG.giras;

/* ---------- Animales ---------- */
function buildAnimals(dict){
  const grid = document.getElementById("aniGrid");
  grid.innerHTML = "";
  ANIMALS.forEach(a => {
    const n = dict[`ani_${a.id}_n`], sp = dict[`ani_${a.id}_s`], st = dict[`ani_${a.id}_st`];
    const badge = {rehabilitating: dict.stRehab, "ready-to-release": dict.stReady, "permanent-resident": dict.stPerm}[a.status] || "";
    const card = document.createElement("article");
    card.className = "ani-card";
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="ani-media">
        <img src="${a.img}" alt="${n} — ${sp}" loading="lazy">
        <p class="ani-story">${st}</p>
      </div>
      <div class="ani-body">
        <div><h3>${n}</h3><p class="sp">${sp}</p></div>
        <span class="badge ${a.status}">${badge}</span>
      </div>`;
    grid.appendChild(card);
  });
}

/* ---------- I18N ---------- */
const langSelect = document.getElementById("langSelect");
Object.keys(I18N).forEach(code => {
  const opt = document.createElement("option");
  opt.value = code;
  opt.textContent = `${I18N[code]._flag} ${I18N[code]._name}`;
  langSelect.appendChild(opt);
});

function applyLang(code){
  const dict = I18N[code] || I18N.es;
  document.documentElement.lang = code;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n;
    if (dict[k] != null) el.textContent = dict[k];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const k = el.dataset.i18nHtml;
    if (dict[k] != null) el.innerHTML = dict[k];
  });
  buildAnimals(dict);
  langSelect.value = code;
  try { localStorage.setItem("crarc-lang", code); } catch(e){}
}

let savedLang = "es";
try { savedLang = localStorage.getItem("crarc-lang") || "es"; } catch(e){}
applyLang(I18N[savedLang] ? savedLang : "es");
langSelect.addEventListener("change", () => applyLang(langSelect.value));

/* ---------- Header + menú móvil ---------- */
const header = document.getElementById("header");
const onScroll = () => header.classList.toggle("solid", window.scrollY > 40);
window.addEventListener("scroll", onScroll, { passive:true });
onScroll();

const toggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");
toggle.addEventListener("click", () => {
  const open = document.body.classList.toggle("menu-open");
  toggle.setAttribute("aria-expanded", open);
});
navLinks.querySelectorAll("a").forEach(a =>
  a.addEventListener("click", () => {
    document.body.classList.remove("menu-open");
    toggle.setAttribute("aria-expanded", "false");
  })
);

/* ---------- Formulario: WhatsApp + Google Sheets ---------- */
function collectForm(){
  const dict = I18N[document.documentElement.lang] || I18N.es;
  const v = id => document.getElementById(id).value.trim();
  const sel = id => { const s = document.getElementById(id); return s.options[s.selectedIndex].textContent; };
  const selVal = id => document.getElementById(id).value;
  const data = {
    nombre: v("fNombre"), email: v("fEmail"), whatsapp: v("fWhats"),
    interes: selVal("fInteres"), personas: v("fPersonas"),
    dieta: selVal("fDieta"), alergias: v("fAlergias") || "-",
    idioma: document.documentElement.lang, pagina: location.pathname
  };
  const texto = [
    `${dict.fNombre}: ${data.nombre}`,
    `${dict.fEmail}: ${data.email}`,
    `${dict.fWhats}: ${data.whatsapp}`,
    `${sel("fInteres")}`,
    `${dict.fPersonas}: ${data.personas}`,
    `${dict.fDieta}: ${sel("fDieta")}`,
    `${dict.fAlergias}: ${data.alergias}`
  ].join("\n");
  return { dict, data, texto };
}

document.getElementById("waBtn").addEventListener("click", () => {
  const { texto } = collectForm();
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(texto)}`, "_blank");
});

document.getElementById("sendBtn").addEventListener("click", async () => {
  const { dict, data, texto } = collectForm();
  const status = document.getElementById("formStatus");
  const btn = document.getElementById("sendBtn");

  /* Sin endpoint configurado: respaldo por correo */
  if (!SHEETS_ENDPOINT){
    window.location.href = `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(dict.formSubject)}&body=${encodeURIComponent(texto)}`;
    return;
  }

  btn.disabled = true;
  status.textContent = dict.sendSending;
  try {
    /* Texto plano para evitar el preflight CORS de Apps Script */
    const res = await fetch(SHEETS_ENDPOINT, { method: "POST", body: JSON.stringify(data) });
    if (!res.ok) throw new Error(res.status);
    status.textContent = dict.sendOk;
  } catch(e){
    status.textContent = dict.sendErr;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
