<style>
:root{
  --ink:        #17251B;
  --canopy:     #2E5339;
  --canopy-dk:  #22402C;
  --leaf:       #7FA96B;
  --mist:       #F2F5EF;
  --paper:      #FBFCF9;
  --sun:        #E9B44C;
  --sun-dk:     #C9962F;
  --line:       #D8E0D2;

  --serif: "Fraunces", Georgia, serif;
  --sans:  "Karla", "Segoe UI", sans-serif;

  --wrap: 1140px;
  --radius: 14px;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  line-height:1.65;
  font-size:1.0625rem;
}

img{max-width:100%;display:block}
a{color:inherit}

.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:24px}

h1,h2,h3{font-family:var(--serif);line-height:1.12;font-weight:600}

.kicker{
  font-family:var(--serif);
  font-style:italic;
  font-size:1.15rem;
  color:var(--canopy);
  display:flex;align-items:center;gap:.6rem;
  margin-bottom:.9rem;
}
.kicker::before{
  content:"";
  width:34px;height:2px;background:var(--leaf);
  border-radius:2px;flex:none;
}

:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:4px}

/* ---------- Header ---------- */
header{
  position:fixed;inset:0 0 auto 0;z-index:50;
  transition:background .3s ease, box-shadow .3s ease;
}
header.solid{
  background:rgba(251,252,249,.96);
  box-shadow:0 1px 0 var(--line);
  backdrop-filter:blur(8px);
}
.nav{
  display:flex;align-items:center;justify-content:space-between;
  padding-block:14px;gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand img{height:52px;width:auto;background:#fff;border-radius:10px;padding:5px}
.brand span{
  font-family:var(--serif);font-weight:700;font-size:1.05rem;line-height:1.15;
  color:#fff;max-width:180px;transition:color .3s;
}
header.solid .brand span{color:var(--canopy-dk)}

.nav-links{display:flex;align-items:center;gap:24px;list-style:none}
.nav-links a{
  text-decoration:none;font-weight:500;font-size:.98rem;color:#fff;
  transition:color .3s;white-space:nowrap;
}
header.solid .nav-links a{color:var(--ink)}
.nav-links a:hover{color:var(--sun)}
header.solid .nav-links a:hover{color:var(--canopy)}

/* Selector de idioma */
.lang{
  position:relative;
}
.lang select{
  appearance:none;-webkit-appearance:none;
  background:rgba(255,255,255,.14);
  border:1.5px solid rgba(255,255,255,.6);
  color:#fff;
  font-family:var(--sans);font-weight:700;font-size:.92rem;
  border-radius:999px;
  padding:.45em 2em .45em 1em;
  cursor:pointer;
  transition:background .3s, color .3s, border-color .3s;
}
.lang::after{
  content:"▾";
  position:absolute;right:.8em;top:50%;transform:translateY(-50%);
  color:#fff;pointer-events:none;font-size:.8rem;
  transition:color .3s;
}
header.solid .lang select{
  background:var(--mist);border-color:var(--line);color:var(--ink);
}
header.solid .lang::after{color:var(--ink)}
.lang select option{color:var(--ink);background:#fff}

.btn{
  display:inline-block;text-decoration:none;font-weight:700;
  border-radius:999px;padding:.72em 1.5em;font-size:1rem;
  border:2px solid transparent;cursor:pointer;background:transparent;
  transition:transform .15s ease, background .2s ease, color .2s ease;
}
.btn:active{transform:scale(.97)}
.btn-sun{background:var(--sun);color:var(--ink)}
.btn-sun:hover{background:var(--sun-dk)}
.btn-ghost{border-color:#fff;color:#fff}
.btn-ghost:hover{background:#fff;color:var(--canopy-dk)}

.nav .btn{padding:.55em 1.3em}

.menu-toggle{
  display:none;background:none;border:0;cursor:pointer;
  width:44px;height:44px;position:relative;z-index:60;
}
.menu-toggle span{
  display:block;width:26px;height:3px;background:#fff;border-radius:3px;
  margin:5px auto;transition:transform .3s, opacity .3s, background .3s;
}
header.solid .menu-toggle span{background:var(--ink)}
.menu-open .menu-toggle span{background:var(--ink)}
.menu-open .menu-toggle span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.menu-open .menu-toggle span:nth-child(2){opacity:0}
.menu-open .menu-toggle span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

/* ---------- Hero ---------- */
.hero{
  min-height:100svh;
  display:flex;align-items:flex-end;
  position:relative;
  isolation:isolate;
  color:#fff;
  overflow:hidden;
}
.hero-bg{
  position:absolute;inset:0;z-index:-2;
  background-size:cover;background-position:center;
}
.hero-video{
  position:absolute;inset:0;z-index:-2;
  width:100%;height:100%;object-fit:cover;
  display:none;
}
.hero-video.on{display:block}
/* YouTube de fondo: iframe centrado y sobredimensionado para simular "cover" */
.hero-yt{
  position:absolute;inset:0;z-index:-2;overflow:hidden;
  display:none;pointer-events:none;
}
.hero-yt.on{display:block}
.hero-yt iframe{
  position:absolute;top:50%;left:50%;
  width:max(100vw, 177.78vh);
  height:max(100vh, 56.25vw);
  transform:translate(-50%,-50%);
  border:0;
}
.hero::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg, rgba(23,37,27,.45) 0%, rgba(23,37,27,.15) 40%, rgba(23,37,27,.82) 100%);
}
.hero-content{padding-top:160px;padding-bottom:120px;max-width:780px}
.hero .kicker{color:var(--sun)}
.hero .kicker::before{background:var(--sun)}
.hero h1{
  font-size:clamp(2.4rem, 6vw, 4.4rem);
  font-weight:700;
  text-wrap:balance;
}
.hero h1 em{font-style:italic;color:#CFE3B8;font-weight:600}
.hero p{
  margin-top:1.1rem;font-size:clamp(1.05rem,2vw,1.25rem);
  max-width:560px;color:#E9EFE4;
}
.hero-cta{margin-top:1.8rem;display:flex;gap:14px;flex-wrap:wrap}

.hero-content > *{opacity:0;transform:translateY(18px);animation:rise .8s ease forwards}
.hero-content > *:nth-child(2){animation-delay:.12s}
.hero-content > *:nth-child(3){animation-delay:.24s}
.hero-content > *:nth-child(4){animation-delay:.36s}
@keyframes rise{to{opacity:1;transform:none}}

.scroll-hint{
  position:absolute;left:50%;bottom:26px;transform:translateX(-50%);
  color:#fff;text-decoration:none;font-size:.9rem;letter-spacing:.06em;
  opacity:.85;text-align:center;
}
.scroll-hint::after{
  content:"";display:block;width:1px;height:34px;background:#fff;
  margin:8px auto 0;opacity:.7;
}

/* ---------- Organic wave dividers ---------- */
.wave{display:block;width:100%;height:70px;margin-bottom:-1px}

/* ---------- Sections ---------- */
section{padding-block:90px}
.section-head{max-width:640px;margin-bottom:56px}
.section-head h2{font-size:clamp(1.9rem,4vw,2.7rem)}

/* How we work */
.how{background:var(--mist)}
.how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px}
.how-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:34px 30px;
  position:relative;
}
.how-card::before{
  content:"";
  position:absolute;top:0;left:30px;
  width:56px;height:5px;border-radius:0 0 6px 6px;
  background:var(--leaf);
}
.how-card:nth-child(2)::before{background:var(--sun)}
.how-card:nth-child(3)::before{background:var(--canopy)}
.how-card h3{font-size:1.45rem;margin-bottom:.8rem;color:var(--canopy-dk)}
.how-card p{font-size:.99rem;color:#33422F}
.how-card p + p{margin-top:.85rem}

/* Quote */
.quote{
  position:relative;isolation:isolate;color:#fff;
  padding-block:150px;text-align:center;
  background-size:cover;background-position:center;
  background-attachment:fixed;
}
.quote::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:rgba(23,37,27,.62);
}
.quote blockquote{
  font-family:var(--serif);font-style:italic;font-weight:600;
  font-size:clamp(1.9rem,5vw,3.3rem);
  max-width:820px;margin-inline:auto;
  text-wrap:balance;
}
.quote figcaption{
  margin-top:1.2rem;font-family:var(--sans);font-size:1rem;
  color:#D9E3D2;letter-spacing:.04em;
}

/* Stats */
.stats{background:var(--canopy-dk);color:#fff;padding-block:78px}
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:30px;text-align:center;
}
.stat b{
  display:block;font-family:var(--serif);font-weight:700;
  font-size:clamp(2.4rem,5vw,3.6rem);color:var(--sun);
  font-variant-numeric:tabular-nums;
}
.stat span{color:#CBDCC6;font-size:1rem}

/* Growth */
.growth .cols{
  display:grid;grid-template-columns:1fr 1.2fr;gap:60px;align-items:center;
}
.growth h2{font-size:clamp(1.9rem,4vw,2.6rem)}
.growth .years{
  font-family:var(--serif);font-style:italic;color:var(--leaf);
  font-size:1.2rem;margin-bottom:.4rem;display:block;
}
.growth p{margin-top:1rem;color:#3E4F43}

.chart{
  background:var(--mist);border:1px solid var(--line);
  border-radius:var(--radius);padding:30px 26px 18px;
}
.chart h3{font-size:1.15rem;color:var(--canopy-dk);margin-bottom:22px}
.bars{display:flex;align-items:flex-end;gap:8px;height:220px}
.bar{
  flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:8px;height:100%;
}
.bar i{
  width:100%;max-width:34px;
  background:linear-gradient(180deg,var(--leaf),var(--canopy));
  border-radius:7px 7px 3px 3px;
  height:calc(var(--h) * 1%);
  min-height:6px;
  transform-origin:bottom;
  transform:scaleY(0);
  transition:transform .8s cubic-bezier(.2,.7,.2,1);
}
.chart.on .bar i{transform:scaleY(1)}
.bar b{
  font-size:.72rem;font-weight:700;color:var(--canopy-dk);
  font-variant-numeric:tabular-nums;
}
.bar span{font-size:.72rem;color:#5C6B5C}

/* Gallery */
.gallery{background:var(--mist)}
.masonry{columns:3;column-gap:16px}
.masonry figure{
  break-inside:avoid;margin-bottom:16px;
  border-radius:var(--radius);overflow:hidden;
  background:var(--line);
}
.masonry img{width:100%;height:auto;display:block;transition:transform .5s ease}
.masonry figure:hover img{transform:scale(1.04)}

/* Padrinos */
.sponsor .intro{max-width:640px;margin-bottom:56px}
.sponsor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.spon-card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  display:flex;flex-direction:column;
}
.spon-card > img{
  width:100%;aspect-ratio:4/3;object-fit:cover;
}
.spon-body{padding:26px 26px 28px;display:flex;flex-direction:column;flex:1}
.spon-body h3{
  font-size:1.6rem;color:var(--canopy-dk);
}
.spon-body .species{
  font-family:var(--serif);font-style:italic;color:var(--leaf);
  margin-bottom:.7rem;
}
.spon-body .desc{font-size:.97rem;color:#33422F;margin-bottom:1.2rem}
.spon-tiers{
  display:flex;flex-direction:column;gap:8px;margin-bottom:1.3rem;
}
.spon-tier{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1.5px solid var(--line);
  background:var(--mist);
  border-radius:10px;
  padding:.55em .9em;
  font-family:var(--sans);font-size:.93rem;color:var(--ink);
  cursor:pointer;text-align:left;
  transition:border-color .2s, background .2s;
}
.spon-tier b{
  font-family:var(--serif);font-size:1.05rem;color:var(--canopy-dk);
  white-space:nowrap;
}
.spon-tier small{color:#5C6B5C;white-space:nowrap}
.spon-tier.sel{
  border-color:var(--canopy);
  background:#E4EEDF;
}
.spon-tier.sel b{color:var(--canopy)}
.spon-card .btn{margin-top:auto;text-align:center}
.spon-note{
  margin-top:34px;color:#5C6B5C;font-size:.95rem;max-width:640px;
}

/* Join CTA */
.join{background:var(--canopy);color:#fff;position:relative;overflow:hidden}
.join .leafmark{
  position:absolute;right:-60px;top:-40px;width:340px;opacity:.10;pointer-events:none;
}
.join-grid{display:grid;grid-template-columns:1fr 1fr;text-align:center}
.join-col{padding:30px 40px}
.join-col + .join-col{border-left:1px solid rgba(255,255,255,.22)}
.join-col small{
  font-family:var(--serif);font-style:italic;font-size:1.1rem;color:#CFE3B8;
}

<script>
/* ---------- Imágenes y video desde la configuración ---------- */
function withFallback(img){
  img.addEventListener("error", () => {
    if (img.src !== IMAGES.fallback) img.src = IMAGES.fallback;
  }, { once:true });
}

document.getElementById("logo").src = IMAGES.logo;
document.getElementById("logoFoot").src = IMAGES.logo;
document.getElementById("heroBg").style.backgroundImage = `url("${IMAGES.hero}")`;
document.getElementById("quoteBg").style.backgroundImage = `url("${IMAGES.quote}")`;

/* Video del hero: prioridad YouTube → mp4 → imagen de respaldo */
const heroVideo = document.getElementById("heroVideo");
const heroYt = document.getElementById("heroYt");
const noMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

if (VIDEO.youtube && !noMotion) {
  const id = VIDEO.youtube.trim();
  const iframe = document.createElement("iframe");
  iframe.src = `https://www.youtube-nocookie.com/embed/${id}`
    + `?autoplay=1&mute=1&loop=1&playlist=${id}`
    + `&controls=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3`;
  iframe.allow = "autoplay; encrypted-media";
  iframe.title = "Video del centro de rescate";
  heroYt.appendChild(iframe);
  heroYt.classList.add("on");
} else if (VIDEO.hero && !noMotion) {
  heroVideo.src = VIDEO.hero;
  heroVideo.poster = IMAGES.hero;
  heroVideo.classList.add("on");
  heroVideo.addEventListener("error", () => heroVideo.classList.remove("on"), { once:true });
}
/* Si no hay video (o reduced motion), queda la imagen del hero */

const masonry = document.getElementById("masonry");
IMAGES.gallery.forEach(url => {
  const fig = document.createElement("figure");
  const img = document.createElement("img");
  img.src = url;
  img.loading = "lazy";
  img.className = "g-img";
  withFallback(img);
  fig.appendChild(img);
  masonry.appendChild(fig);
});

/* ---------- I18N ---------- */
const langSelect = document.getElementById("langSelect");
Object.keys(I18N).forEach(code => {
  const opt = document.createElement("option");
  opt.value = code;
  opt.textContent = `${I18N[code]._flag} ${I18N[code]._name}`;
  langSelect.appendChild(opt);
});

/* ---------- Padrinos ---------- */
/* Estado actual de los padrinos: arranca con los de SPONSORS y se
   reemplaza con lo que diga la hoja "Padrinos" si hay CONFIG_ENDPOINT. */
let SPONSOR_DATA = SPONSORS.map((s, i) => ({
  id: s.id, name: s.name, img: s.img, amounts: s.amounts,
  boton: "whatsapp", paypal: "", i18nIndex: i + 1
}));

function paypalUrl(animal, amount){
  const p = animal.paypal.replace(/\/+$/, "");
  if (/^https?:\/\//i.test(p)) {
    /* Enlace completo: a paypal.me se le agrega el monto; otros (donación,
       suscripción, hosted button) se abren tal cual */
    return p.includes("paypal.me") ? `${p}/${amount}USD` : p;
  }
  /* Solo el usuario de paypal.me */
  return `https://paypal.me/${p}/${amount}USD`;
}

function buildSponsors(dict){
  const grid = document.getElementById("sponsorGrid");
  grid.innerHTML = "";
  SPONSOR_DATA.forEach(animal => {
    const n = animal.i18nIndex;
    /* Los 3 animales base (a1-a3) usan las traducciones de I18N;
       animales nuevos agregados en la hoja usan su texto tal cual */
    const especie = n ? dict["sponA"+n+"sp"] : (animal.especie || "");
    const historia = n ? dict["sponA"+n+"d"] : (animal.historia || "");

    const card = document.createElement("article");
    card.className = "spon-card";

    const img = document.createElement("img");
    img.src = animal.img || IMAGES.fallback;
    img.loading = "lazy";
    img.alt = `${animal.name} — ${especie}`;
    withFallback(img);
    card.appendChild(img);

    const body = document.createElement("div");
    body.className = "spon-body";
    body.innerHTML = `
      <h3>${animal.name}</h3>
      <p class="species">${especie}</p>
      <p class="desc">${historia}</p>
    `;

    const tiers = document.createElement("div");
    tiers.className = "spon-tiers";
    animal.amounts.forEach((amount, ti) => {
      const tier = document.createElement("button");
      tier.type = "button";
      tier.className = "spon-tier" + (ti === 0 ? " sel" : "");
      const label = dict["sponT"+(ti+1)] || "";
      tier.innerHTML = `<b>$${amount}</b><span>${label}</span><small>${dict.sponPerMonth}</small>`;
      tier.addEventListener("click", () => {
        tiers.querySelectorAll(".spon-tier").forEach(t => t.classList.remove("sel"));
        tier.classList.add("sel");
      });
      tiers.appendChild(tier);
    });
    body.appendChild(tiers);

    const cta = document.createElement("a");
    cta.className = "btn btn-green";
    cta.href = "#";
    cta.textContent = `${dict.sponBtn} ${animal.name}`;
    cta.addEventListener("click", (ev) => {
      ev.preventDefault();
      const selTier = tiers.querySelector(".spon-tier.sel b");
      const amount = selTier ? selTier.textContent.replace("$", "") : animal.amounts[0];
      if (animal.boton === "paypal" && animal.paypal) {
        window.open(paypalUrl(animal, amount), "_blank");
      } else {
        const msg = dict.sponWa.replace("{name}", animal.name).replace("{amount}", amount);
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
      }
    });
    body.appendChild(cta);

    card.appendChild(body);
    grid.appendChild(card);
  });
}

/* Cargar la configuración de padrinos desde la hoja de cálculo */
function cargarPadrinosRemotos(){
  if (!CONFIG_ENDPOINT) return;
  const porDefecto = Object.fromEntries(SPONSORS.map(s => [s.id, s]));
  const indices = { a1: 1, a2: 2, a3: 3, a4: 4, a5: 5, a6: 6 };
  fetch(`${CONFIG_ENDPOINT}?config=1`)
    .then(r => r.json())
    .then(cfg => {
      if (!cfg.ok || !Array.isArray(cfg.padrinos) || !cfg.padrinos.length) return;
      SPONSOR_DATA = cfg.padrinos.map(p => ({
        id: p.id,
        name: p.nombre || (porDefecto[p.id] || {}).name || p.id,
        img: p.foto || (porDefecto[p.id] || {}).img || "",
        amounts: (p.montos && p.montos.length) ? p.montos : ((porDefecto[p.id] || {}).amounts || [10, 25, 50]),
        boton: p.boton === "paypal" ? "paypal" : "whatsapp",
        paypal: p.paypal || "",
        i18nIndex: indices[p.id] || 0,
        especie: p.especie || "",
        historia: p.historia || ""
      }));
      const dict = I18N[document.documentElement.lang] || I18N.es;
      buildSponsors(dict);
    })
    .catch(() => { /* sin conexión o sin config: quedan los de por defecto */ });
}

/* ---------- Formas de donar ---------- */
function payRow(label, value, copiable, dict){
  const copy = copiable
    ? `<button type="button" class="copy-btn" data-copy="${value}">${dict.payCopy}</button>`
    : "";
  return `<div class="pay-row"><small>${label}</small><div class="pay-val"><span>${value}</span>${copy}</div></div>`;
}

function buildPayments(dict){
  const grid = document.getElementById("payGrid");
  grid.innerHTML = `
    <div class="pay-card">
      <h4>${dict.paySinpe}</h4>
      ${payRow(dict.payHolder, PAYMENT.sinpe.holder, false, dict)}
      ${payRow(dict.paySinpe, PAYMENT.sinpe.number, true, dict)}
    </div>
    <div class="pay-card">
      <h4>${dict.payCrc} — CRC ₡</h4>
      ${payRow(dict.payHolder, PAYMENT.crc.holder, false, dict)}
      ${payRow(dict.payBac, PAYMENT.crc.bac, true, dict)}
      ${payRow("IBAN", PAYMENT.crc.iban, true, dict)}
    </div>
    <div class="pay-card">
      <h4>${dict.payUsd} — USD $</h4>
      ${payRow(dict.payHolder, PAYMENT.usd.holder, false, dict)}
      ${payRow(dict.payBac, PAYMENT.usd.bac, true, dict)}
      ${payRow("IBAN", PAYMENT.usd.iban, true, dict)}
    </div>
  `;
  grid.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const text = btn.dataset.copy.replace(/-/g, "");
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; }
      catch(e){
        /* Fallback para navegadores viejos o contextos sin clipboard API */
        const ta = document.createElement("textarea");
        ta.value = text; document.body.appendChild(ta);
        ta.select(); ok = document.execCommand("copy");
        ta.remove();
      }
      if (ok){
        const dict = I18N[document.documentElement.lang] || I18N.es;
        btn.textContent = dict.payCopied;
        btn.classList.add("ok");
        setTimeout(() => { btn.textContent = dict.payCopy; btn.classList.remove("ok"); }, 1600);
      }
    });
  });
}

function applyLang(code){
  const dict = I18N[code] || I18N.es;
  document.documentElement.lang = code;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.dataset.i18n;
    if (dict[k] != null) el.textContent = dict[k];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const k = el.dataset.i18nHtml;
    if (dict[k] != null) el.innerHTML = dict[k];
  });
  document.querySelectorAll(".g-img").forEach(img => img.alt = dict.galleryAlt);
  buildSponsors(dict);
  buildPayments(dict);
  langSelect.value = code;
  try { localStorage.setItem("crarc-lang", code); } catch(e){ /* sin storage, no pasa nada */ }
}

let savedLang = "es";
try { savedLang = localStorage.getItem("crarc-lang") || "es"; } catch(e){}
applyLang(I18N[savedLang] ? savedLang : "es");

langSelect.addEventListener("change", () => applyLang(langSelect.value));
cargarPadrinosRemotos();

/* ---------- Header sólido al hacer scroll ---------- */
const header = document.getElementById("header");
const onScroll = () => header.classList.toggle("solid", window.scrollY > 40);
window.addEventListener("scroll", onScroll, { passive:true });
onScroll();

/* ---------- Menú móvil ---------- */
const toggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");
toggle.addEventListener("click", () => {
  const open = document.body.classList.toggle("menu-open");
  toggle.setAttribute("aria-expanded", open);
});
navLinks.querySelectorAll("a").forEach(a =>
  a.addEventListener("click", () => {
    document.body.classList.remove("menu-open");
    toggle.setAttribute("aria-expanded", "false");
  })
);

/* ---------- Gráfico de barras ---------- */
const barsEl = document.getElementById("bars");
const maxCount = Math.max(...RESCUE_DATA.map(d => d.count));
RESCUE_DATA.forEach(d => {
  const bar = document.createElement("div");
  bar.className = "bar";
  bar.innerHTML = `<b>${d.count}</b><i style="--h:${Math.round(d.count / maxCount * 100)}"></i><span>${d.year}</span>`;
  barsEl.appendChild(bar);
});

/* ---------- Animaciones al entrar en viewport ---------- */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const chart = document.getElementById("chart");
const chartObs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting){ chart.classList.add("on"); chartObs.disconnect(); }
  });
}, { threshold:.35 });
chartObs.observe(chart);

function animateCount(el){
  const target = +el.dataset.count;
  const suffix = el.dataset.suffix || "";
  const fmt = el.dataset.format === "thousands"
    ? n => n.toLocaleString()
    : n => n;
  if (reduceMotion){ el.textContent = fmt(target) + suffix; return; }
  const dur = 1400, start = performance.now();
  function tick(now){
    const p = Math.min((now - start) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(target * eased)) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

const statsObs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting){
      e.target.querySelectorAll("b[data-count]").forEach(animateCount);
      statsObs.disconnect();
    }
  });
}, { threshold:.4 });
statsObs.observe(document.getElementById("statsGrid"));
</script>
